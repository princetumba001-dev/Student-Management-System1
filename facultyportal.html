<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Faculty Portal – CampusHub</title>
  <style>
/* Shared base styles: theme, layout, nav, buttons, cards, forms, tables, modal, toast.
   Page-specific styles live in index.css, login.css, studentportal.css, facultyportal.css, admin.css. */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap');

:root {
  --bg: #060a13;
  --bg2: #0b1222;
  --panel: rgba(255, 255, 255, .05);
  --panel-strong: rgba(255, 255, 255, .08);
  --line: rgba(255, 255, 255, .1);
  --text: #e8eef9;
  --muted: #8fa0bd;
  --accent: #2dd4bf;
  --accent-2: #fbbf24;
  --danger: #fb7185;
  --ok: #4ade80;
  --radius: 18px;
  --shadow: 0 20px 60px rgba(0, 0, 0, .45);
  --font: 'Inter', system-ui, -apple-system, Segoe UI, sans-serif;
  --display: 'Space Grotesk', 'Inter', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
img, svg { max-width: 100%; }
::selection { background: var(--accent); color: #04110f; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .15); border-radius: 10px; }

/* ---------- animated background ---------- */
#bg { position: fixed; inset: 0; z-index: -2; width: 100%; height: 100%; }
.blobs { position: fixed; inset: 0; z-index: -3; overflow: hidden; background: radial-gradient(circle at 20% 0%, var(--bg2), var(--bg) 60%); }
.blob { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; filter: blur(90px); opacity: .28; animation: drift 22s ease-in-out infinite alternate; }
.blob.b1 { background: var(--accent); top: -15%; left: -10%; }
.blob.b2 { background: #6366f1; bottom: -20%; right: -10%; animation-duration: 28s; animation-delay: -6s; }
.blob.b3 { background: var(--accent-2); top: 40%; left: 45%; width: 30vmax; height: 30vmax; opacity: .12; animation-duration: 34s; }
@keyframes drift {
  0% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(8vw, 6vh) scale(1.15); }
  100% { transform: translate(-6vw, 10vh) scale(.95); }
}

/* ---------- layout ---------- */
.container { width: min(1200px, 92%); margin: 0 auto; }
.grid { display: grid; gap: 18px; }
.grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.hidden { display: none !important; }
.gradient-text {
  background: linear-gradient(110deg, var(--accent), var(--accent-2), #818cf8, var(--accent));
  background-size: 250% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shine 6s linear infinite;
}
@keyframes shine { to { background-position: 250% 0; } }

/* ---------- nav ---------- */
.nav { position: sticky; top: 0; z-index: 50; backdrop-filter: blur(16px); background: rgba(6, 10, 19, .6); border-bottom: 1px solid var(--line); }
.nav .container { display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 16px; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 1.25rem; }
.logo-mark { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: #04110f; font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 0 24px rgba(45, 212, 191, .45); animation: glow 3s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 38px rgba(251, 191, 36, .5); } }
.nav-links { display: flex; gap: 26px; color: var(--muted); font-weight: 500; }
.nav-links a { position: relative; transition: color .2s; }
.nav-links a::after { content: ''; position: absolute; left: 0; bottom: -6px; height: 2px; width: 0; background: var(--accent); transition: width .25s; }
.nav-links a:hover { color: var(--text); }
.nav-links a:hover::after { width: 100%; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 20px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--panel); color: var(--text); font-weight: 600; font-size: .95rem; transition: transform .18s, box-shadow .25s, background .25s, border-color .25s; position: relative; overflow: hidden; }
.btn:hover { transform: translateY(-2px); background: var(--panel-strong); border-color: rgba(255, 255, 255, .22); }
.btn:active { transform: translateY(0) scale(.98); }
.btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
.btn-primary { background: linear-gradient(135deg, var(--accent), #22d3ee); color: #04110f; border: none; box-shadow: 0 8px 28px rgba(45, 212, 191, .35); }
.btn-primary:hover { background: linear-gradient(135deg, #5eead4, #67e8f9); box-shadow: 0 12px 36px rgba(45, 212, 191, .5); }
.btn-danger { color: var(--danger); border-color: rgba(251, 113, 133, .35); }
.btn-sm { padding: 7px 13px; font-size: .85rem; border-radius: 10px; }
.btn.loading { pointer-events: none; color: transparent; }
.btn.loading::after { content: ''; position: absolute; width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(4, 17, 15, .3); border-top-color: #04110f; animation: spin .7s linear infinite; }
.btn:not(.btn-primary).loading::after { border-color: rgba(255, 255, 255, .3); border-top-color: #fff; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- cards ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; backdrop-filter: blur(14px); box-shadow: var(--shadow); transition: transform .3s, border-color .3s; }
.card:hover { border-color: rgba(45, 212, 191, .35); }
.card h3 { font-family: var(--display); margin-bottom: 6px; }
.tilt { transform-style: preserve-3d; transition: transform .15s ease-out; will-change: transform; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: .82rem; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
.input, select.input, textarea.input {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0, 0, 0, .28); color: var(--text); font: inherit; outline: none; transition: border-color .2s, box-shadow .2s;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(45, 212, 191, .15); }
textarea.input { min-height: 110px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85rem; }
select.input option { background: #0b1222; }
.pw-wrap { position: relative; }
.pw-wrap button { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--muted); padding: 6px; }
.alert { padding: 11px 14px; border-radius: 12px; font-size: .9rem; margin-bottom: 14px; border: 1px solid; animation: pop .3s ease; }
.alert.error { background: rgba(251, 113, 133, .1); border-color: rgba(251, 113, 133, .4); color: #fecdd3; }
.alert.ok { background: rgba(74, 222, 128, .1); border-color: rgba(74, 222, 128, .4); color: #bbf7d0; }
.alert.info { background: rgba(45, 212, 191, .08); border-color: rgba(45, 212, 191, .35); color: #ccfbf1; }
@keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.98); } }

/* ---------- badges / tabs ---------- */
.badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .75rem; font-weight: 600; border: 1px solid var(--line); background: var(--panel); text-transform: capitalize; }
.badge.admin { color: var(--accent-2); border-color: rgba(251, 191, 36, .4); }
.badge.faculty { color: #a5b4fc; border-color: rgba(129, 140, 248, .4); }
.badge.student { color: var(--accent); border-color: rgba(45, 212, 191, .4); }
.badge.pending { color: var(--danger); border-color: rgba(251, 113, 133, .4); }
.tabs { display: inline-flex; padding: 5px; gap: 4px; background: rgba(0, 0, 0, .3); border: 1px solid var(--line); border-radius: 14px; flex-wrap: wrap; }
.tab { padding: 9px 18px; border-radius: 10px; border: none; background: none; color: var(--muted); font-weight: 600; transition: all .25s; }
.tab:hover { color: var(--text); }
.tab.active { background: linear-gradient(135deg, var(--accent), #22d3ee); color: #04110f; box-shadow: 0 6px 20px rgba(45, 212, 191, .3); }

/* ---------- dashboard shell ---------- */
.page-head { padding: 34px 0 10px; }
.page-head h1 { font-family: var(--display); font-size: clamp(1.7rem, 3vw, 2.4rem); }
.avatar { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #04110f; background: linear-gradient(135deg, var(--accent), var(--accent-2)); flex: none; }
.avatar.lg { width: 84px; height: 84px; font-size: 1.9rem; box-shadow: 0 0 0 5px rgba(45, 212, 191, .15), 0 0 40px rgba(45, 212, 191, .3); }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .num { font-family: var(--display); font-size: 2rem; font-weight: 700; }
.stat .label { color: var(--muted); font-size: .85rem; }
.kv { display: grid; grid-template-columns: 120px 1fr; gap: 8px 14px; font-size: .92rem; }
.kv dt { color: var(--muted); }
.section { margin: 26px 0 40px; }
.section > h2 { font-family: var(--display); margin-bottom: 14px; font-size: 1.3rem; }

/* tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
table { width: 100%; border-collapse: collapse; min-width: 640px; }
th, td { text-align: left; padding: 13px 16px; border-bottom: 1px solid var(--line); font-size: .92rem; }
th { color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; background: rgba(0, 0, 0, .2); }
tbody tr { transition: background .2s; }
tbody tr:hover { background: rgba(255, 255, 255, .04); }
tbody tr:last-child td { border-bottom: none; }
.empty { text-align: center; padding: 38px 10px; color: var(--muted); }

/* progress bar */
.bar { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 1.2s cubic-bezier(.2, .8, .2, 1); }

@keyframes slideIn { from { opacity: 0; transform: translateX(-18px); } }


/* modal */
.modal-back { position: fixed; inset: 0; z-index: 100; background: rgba(2, 5, 12, .72); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 18px; }
.modal-back.open { display: flex; animation: fade .25s; }
.modal { width: min(720px, 100%); max-height: 90vh; overflow: auto; background: #0c1426; border: 1px solid var(--line); border-radius: 22px; padding: 26px; box-shadow: var(--shadow); animation: rise .35s cubic-bezier(.2, .8, .2, 1); }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(28px) scale(.97); } }

/* toast */
#toasts { position: fixed; right: 18px; top: 18px; z-index: 300; display: flex; flex-direction: column; gap: 10px; }
.toast { min-width: 240px; max-width: 360px; padding: 13px 16px; border-radius: 14px; background: #101a30; border: 1px solid var(--line); box-shadow: var(--shadow); animation: toastIn .4s cubic-bezier(.2, .8, .2, 1); }
.toast.success { border-left: 4px solid var(--ok); }
.toast.error { border-left: 4px solid var(--danger); }
.toast.out { animation: toastOut .3s forwards; }
@keyframes toastIn { from { opacity: 0; transform: translateX(40px); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(40px); } }

/* skeleton */
.skeleton { background: linear-gradient(90deg, rgba(255, 255, 255, .05) 25%, rgba(255, 255, 255, .12) 50%, rgba(255, 255, 255, .05) 75%); background-size: 200% 100%; animation: sk 1.3s infinite; border-radius: 12px; min-height: 22px; }
@keyframes sk { to { background-position: -200% 0; } }

/* reveal on scroll */
.reveal { opacity: 0; transform: translateY(26px); transition: opacity .8s cubic-bezier(.2, .8, .2, 1), transform .8s cubic-bezier(.2, .8, .2, 1); transition-delay: var(--d, 0s); }
.reveal.in { opacity: 1; transform: none; }

/* typing dots (chat + landing) */
.typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: bounce 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-7px); opacity: 1; } }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .grid.cols-3, .grid.cols-4 { grid-template-columns: repeat(2, 1fr); }
  .nav-links { display: none; }
}
@media (max-width: 600px) {
  .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr; }
  .kv { grid-template-columns: 1fr; gap: 2px 0; }
  .kv dd { margin-bottom: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-iteration-count: 1 !important; transition-duration: .001s !important; }
  .reveal { opacity: 1; transform: none; }
}

/* ===== facultyportal.css ===== */
/* facultyportal.html – student cards and toolbar */
.s-card { cursor: pointer; display: flex; flex-direction: column; gap: 12px; }

.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .filters { display: flex; gap: 12px; flex: 1; min-width: 260px; flex-wrap: wrap; }
.toolbar .filters .input { width: auto; flex: 1 1 160px; max-width: 360px; }
tbody tr[data-id] { cursor: pointer; }
  </style>
</head>

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== firebase-config.js ===== */
// ============================================================
//  1. Firebase console -> Project settings -> Your apps -> Web app
//  2. Paste the config object below.
//  3. Enable Authentication -> Email/Password and create Firestore.
// ============================================================

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID",
};

// The Node backend. When the backend itself serves these pages (npm start ->
// http://localhost:5000) the API is on the same origin. If you open the pages
// from another dev server (e.g. VS Code Live Server) it falls back to :5000.
const API_BASE =
  location.port === "5000" ? "" : `${location.protocol}//${location.hostname || "localhost"}:5000`;

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ===== ui.js ===== */
// Shared UI helpers: escaping, toasts, animations, tiny markdown renderer.

const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ESC[c]);

const initials = (name = "") =>
  name.trim().split(/\s+/).slice(0, 2).map((w) => w[0]?.toUpperCase() || "").join("") || "?";

const qs = (sel, root = document) => root.querySelector(sel);
const qsa = (sel, root = document) => [...root.querySelectorAll(sel)];

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- toast ---------- */
function toast(message, type = "success", ms = 3500) {
  let box = document.getElementById("toasts");
  if (!box) {
    box = document.createElement("div");
    box.id = "toasts";
    document.body.appendChild(box);
  }
  const t = document.createElement("div");
  t.className = `toast ${type}`;
  t.textContent = message;
  box.appendChild(t);
  setTimeout(() => {
    t.classList.add("out");
    setTimeout(() => t.remove(), 300);
  }, ms);
}

function setLoading(btn, on) {
  btn.classList.toggle("loading", on);
  btn.disabled = on;
}

/* ---------- animated particle network background ---------- */
function initBackground(canvas) {
  if (!canvas || reduced) return;
  const ctx = canvas.getContext("2d");
  let w, h, pts = [];
  const mouse = { x: -999, y: -999 };

  const resize = () => {
    w = canvas.width = innerWidth;
    h = canvas.height = innerHeight;
    const n = Math.min(90, Math.floor((w * h) / 20000));
    pts = Array.from({ length: n }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4,
    }));
  };
  addEventListener("resize", resize);
  addEventListener("mousemove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
  resize();

  const tick = () => {
    if (document.hidden) return requestAnimationFrame(tick);
    ctx.clearRect(0, 0, w, h);
    for (const p of pts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
      const dm = Math.hypot(p.x - mouse.x, p.y - mouse.y);
      if (dm < 140) { p.x += (p.x - mouse.x) * 0.01; p.y += (p.y - mouse.y) * 0.01; }
      ctx.fillStyle = "rgba(45,212,191,.7)";
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, 6.283); ctx.fill();
    }
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
        if (d < 120) {
          ctx.strokeStyle = `rgba(45,212,191,${0.16 * (1 - d / 120)})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();
        }
      }
    }
    requestAnimationFrame(tick);
  };
  tick();
}

/* ---------- reveal on scroll ---------- */
function initReveal(root = document) {
  const els = qsa(".reveal:not(.in)", root);
  if (reduced || !("IntersectionObserver" in window)) return els.forEach((e) => e.classList.add("in"));
  const io = new IntersectionObserver((entries) => {
    entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
  }, { threshold: 0.12 });
  els.forEach((el, i) => { el.style.setProperty("--d", `${(i % 6) * 0.07}s`); io.observe(el); });
}

/* ---------- count-up numbers ---------- */
function countUp(el, to, ms = 1200) {
  if (reduced) { el.textContent = to; return; }
  const start = performance.now();
  const from = Number(el.textContent) || 0;
  const step = (now) => {
    const p = Math.min(1, (now - start) / ms);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * eased);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---------- 3D tilt on hover ---------- */
function initTilt(root = document) {
  if (reduced) return;
  qsa(".tilt", root).forEach((el) => {
    if (el.dataset.tilt) return;
    el.dataset.tilt = "1";
    el.addEventListener("mousemove", (e) => {
      const r = el.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      el.style.transform = `perspective(800px) rotateY(${x * 10}deg) rotateX(${-y * 10}deg) translateY(-4px)`;
    });
    el.addEventListener("mouseleave", () => { el.style.transform = ""; });
  });
}

/* ---------- typewriter that cycles through phrases ---------- */
function typewriter(el, phrases, { speed = 70, pause = 1600 } = {}) {
  if (reduced) { el.textContent = phrases[0]; return; }
  let i = 0, j = 0, deleting = false;
  const loop = () => {
    const full = phrases[i];
    j += deleting ? -1 : 1;
    el.textContent = full.slice(0, j);
    let delay = deleting ? speed / 2 : speed;
    if (!deleting && j === full.length) { deleting = true; delay = pause; }
    else if (deleting && j === 0) { deleting = false; i = (i + 1) % phrases.length; delay = 300; }
    setTimeout(loop, delay);
  };
  loop();
}

/* ---------- minimal, XSS-safe markdown for chatbot replies ---------- */
const inline = (s) => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

function mdToHtml(src) {
  return esc(src).split("```").map((part, idx) => {
    if (idx % 2 === 1) return `<pre><code>${part.replace(/^\w*\n/, "")}</code></pre>`;
    let out = "", inList = false;
    for (const line of part.split("\n")) {
      const m = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)$/);
      if (m) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${inline(m[1])}</li>`; }
      else {
        if (inList) { out += "</ul>"; inList = false; }
        if (line.trim()) out += `<p>${inline(line)}</p>`;
      }
    }
    return inList ? out + "</ul>" : out;
  }).join("");
}

/* ===== auth-guard.js ===== */
// Protects a page: resolves with { user, profile } only if the signed-in user
// has one of the allowed roles, otherwise sends them back to login.html.

function requireRole(allowed) {
  return new Promise((resolve) => {
    onAuthStateChanged(auth, async (user) => {
      if (!user) return location.replace("login.html");
      try {
        const snap = await getDoc(doc(db, "users", user.uid));
        const profile = snap.exists() ? snap.data() : null;
        if (!profile || !allowed.includes(profile.role)) return location.replace("login.html?denied=1");
        resolve({ user, profile });
      } catch (err) {
        console.error(err);
        location.replace("login.html?error=1");
      }
    });
  });
}

const logout = () => signOut(auth).then(() => location.replace("login.html"));

/* ===== faculty.js ===== */
const $ = (id) => document.getElementById(id);

initBackground($("bg"));
$("logout").addEventListener("click", logout);

const { profile } = await requireRole(["faculty", "admin"]);
$("who").textContent = profile.name;
initReveal();

let students = [];
let view = "cards";

$("list").innerHTML = `<div class="grid cols-3">${'<div class="skeleton" style="height:150px"></div>'.repeat(6)}</div>`;

function filtered() {
  const q = $("search").value.trim().toLowerCase();
  const dept = $("dept").value;
  const sort = $("sort").value;
  const list = students.filter((s) =>
    (!dept || s.department === dept) &&
    (!q || [s.name, s.rollNo, s.email].some((v) => String(v || "").toLowerCase().includes(q))));
  list.sort((a, b) => sort === "attendance"
    ? (Number(b.attendance) || 0) - (Number(a.attendance) || 0)
    : String(a[sort] || "").localeCompare(String(b[sort] || ""), undefined, { numeric: true }));
  return list;
}

function renderStats() {
  countUp($("cTotal"), students.length);
  countUp($("cDepts"), new Set(students.map((s) => s.department).filter(Boolean)).size);
  const atts = students.map((s) => Number(s.attendance)).filter((n) => !Number.isNaN(n));
  countUp($("cAtt"), atts.length ? Math.round(atts.reduce((a, b) => a + b, 0) / atts.length) : 0);

  const current = $("dept").value;
  const depts = [...new Set(students.map((s) => s.department).filter(Boolean))].sort();
  $("dept").innerHTML = `<option value="">All departments</option>` +
    depts.map((d) => `<option value="${esc(d)}"${d === current ? " selected" : ""}>${esc(d)}</option>`).join("");
}

function renderList() {
  const list = filtered();
  if (!list.length) {
    $("list").innerHTML = `<div class="card empty">${students.length ? "No students match your search." : "No student records yet. An admin can add them."}</div>`;
    return;
  }
  if (view === "table") {
    $("list").innerHTML = `
      <div class="table-wrap"><table>
        <thead><tr><th>Student</th><th>Roll no</th><th>Department</th><th>Year</th><th>Sem</th><th>Attendance</th></tr></thead>
        <tbody>${list.map((s) => `
          <tr data-id="${esc(s.id)}">
            <td><div class="row" style="flex-wrap:nowrap"><div class="avatar">${esc(initials(s.name))}</div><div><strong>${esc(s.name)}</strong><div class="muted small">${esc(s.email)}</div></div></div></td>
            <td>${esc(s.rollNo || "—")}</td><td>${esc(s.department || "—")}</td><td>${esc(s.year || "—")}</td><td>${esc(s.semester || "—")}</td>
            <td>${esc(s.attendance ?? "—")}${s.attendance != null && s.attendance !== "" ? "%" : ""}</td>
          </tr>`).join("")}</tbody>
      </table></div>`;
  } else {
    $("list").innerHTML = `<div class="grid cols-3">${list.map((s, i) => `
      <article class="card s-card tilt" data-id="${esc(s.id)}" style="animation:slideIn .45s ${Math.min(i, 12) * 0.04}s both">
        <div class="row" style="flex-wrap:nowrap"><div class="avatar">${esc(initials(s.name))}</div>
          <div style="min-width:0"><strong>${esc(s.name)}</strong><div class="muted small" style="overflow:hidden;text-overflow:ellipsis">${esc(s.email)}</div></div></div>
        <div class="row"><span class="badge student">${esc(s.department || "No dept")}</span><span class="badge">Year ${esc(s.year || "—")}</span><span class="badge">${esc(s.rollNo || "No roll no")}</span></div>
        <div><div class="row between small"><span class="muted">Attendance</span><strong>${esc(s.attendance ?? 0)}%</strong></div>
          <div class="bar" style="margin-top:6px"><i data-w="${Math.max(0, Math.min(100, Number(s.attendance) || 0))}"></i></div></div>
      </article>`).join("")}</div>`;
    initTilt($("list"));
    requestAnimationFrame(() => requestAnimationFrame(() =>
      $("list").querySelectorAll(".bar > i").forEach((b) => { b.style.width = b.dataset.w + "%"; })));
  }
  $("list").querySelectorAll("[data-id]").forEach((el) => el.addEventListener("click", () => openModal(el.dataset.id)));
}

function openModal(id) {
  const s = students.find((x) => x.id === id);
  if (!s) return;
  const classes = s.classes || [], subjects = s.subjects || [];
  $("modal").innerHTML = `
    <div class="row between" style="margin-bottom:18px">
      <div class="row"><div class="avatar lg">${esc(initials(s.name))}</div>
        <div><h2 style="font-family:var(--display)">${esc(s.name)}</h2><span class="muted small">${esc(s.rollNo ? "Roll No. " + s.rollNo : "No roll number")}</span></div></div>
      <button class="btn btn-sm" id="closeModal">✕</button>
    </div>
    <dl class="kv" style="margin-bottom:22px">
      <dt>Email</dt><dd>${esc(s.email || "—")}</dd><dt>Phone</dt><dd>${esc(s.phone || "—")}</dd>
      <dt>Department</dt><dd>${esc(s.department || "—")}</dd><dt>Year / Sem</dt><dd>${esc(s.year || "—")} / ${esc(s.semester || "—")}</dd>
      <dt>Attendance</dt><dd>${esc(s.attendance ?? "—")}%</dd>
    </dl>
    <h3 style="margin-bottom:8px">Subjects (${subjects.length})</h3>
    <div class="table-wrap" style="margin-bottom:22px"><table style="min-width:0"><thead><tr><th>Code</th><th>Subject</th><th>Credits</th><th>Marks</th></tr></thead><tbody>
      ${subjects.length ? subjects.map((x) => `<tr><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${esc(x.credits)}</td><td>${esc(x.marks === "" || x.marks == null ? "—" : x.marks + "%")}</td></tr>`).join("") : `<tr><td colspan="4" class="empty">None assigned</td></tr>`}
    </tbody></table></div>
    <h3 style="margin-bottom:8px">Classes (${classes.length})</h3>
    <div class="table-wrap"><table style="min-width:0"><thead><tr><th>Day</th><th>Time</th><th>Subject</th><th>Room</th></tr></thead><tbody>
      ${classes.length ? classes.map((c) => `<tr><td>${esc(c.day)}</td><td>${esc(c.time)}</td><td>${esc(c.subject)}</td><td>${esc(c.room)}</td></tr>`).join("") : `<tr><td colspan="4" class="empty">None scheduled</td></tr>`}
    </tbody></table></div>`;
  $("modalBack").classList.add("open");
  $("closeModal").addEventListener("click", closeModal);
}
const closeModal = () => $("modalBack").classList.remove("open");
$("modalBack").addEventListener("click", (e) => { if (e.target === $("modalBack")) closeModal(); });
addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

// CSV export – cells starting with = + - @ are prefixed so spreadsheets don't run them as formulas.
function csvCell(v) {
  let s = String(v ?? "");
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return `"${s.replace(/"/g, '""')}"`;
}
$("exportCsv").addEventListener("click", () => {
  const list = filtered();
  if (!list.length) return toast("Nothing to export.", "error");
  const head = ["Name", "Roll No", "Email", "Phone", "Department", "Year", "Semester", "Attendance"];
  const rows = list.map((s) => [s.name, s.rollNo, s.email, s.phone, s.department, s.year, s.semester, s.attendance].map(csvCell).join(","));
  const blob = new Blob([[head.map(csvCell).join(","), ...rows].join("\n")], { type: "text/csv" });
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: "students.csv" });
  a.click();
  URL.revokeObjectURL(a.href);
  toast(`Exported ${list.length} students`);
});

["search", "dept", "sort"].forEach((id) => $(id).addEventListener("input", renderList));
$("viewTabs").querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => {
  view = t.dataset.view;
  $("viewTabs").querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === t));
  renderList();
}));

onSnapshot(collection(db, "students"),
  (snap) => {
    students = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    renderStats();
    renderList();
  },
  (err) => {
    console.error(err);
    $("list").innerHTML = `<div class="card empty">Couldn't load students (${esc(err.code)}). Check your Firestore rules.</div>`;
  });

  </script>
